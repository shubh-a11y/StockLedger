services:
  db:
    image: postgres:16-alpine
    container_name: stockledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockledger
      POSTGRES_USER: stockledger
      POSTGRES_PASSWORD: stockledger_dev_password
    ports:
      - "5432:5432"
    volumes:
      - stockledger_pgdata:/var/lib/postgresql/data
      # Creates the dedicated test database on first initialisation only.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockledger -d stockledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockledger_pgdata:
